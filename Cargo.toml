[package]
name = "lls-addon-install"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
jsonc-parser = { version = "0.26.2", features = ["cst", "serde"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0.145"
